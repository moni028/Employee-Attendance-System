services:
  - type: web
    name: employee-attendance
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run.py db upgrade && gunicorn --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: OFFICE_START_TIME
        value: "09:30"
      - key: OFFICE_END_TIME
        value: "18:00"
      - key: STANDARD_WORKING_HOURS
        value: "8"
      - key: LATE_THRESHOLD_MINUTES
        value: "0"
      - key: HALF_DAY_THRESHOLD_HOURS
        value: "4"